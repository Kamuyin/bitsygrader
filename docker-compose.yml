services:
  moodle-db:
    image: postgres:16-alpine
    container_name: bitsygrader-moodle-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MOODLE_DB_USER:-moodle}
      POSTGRES_PASSWORD: ${MOODLE_DB_PASSWORD:-moodle_password}
      POSTGRES_DB: ${MOODLE_DB_NAME:-moodle}
    volumes:
      - moodle_db_data:/var/lib/postgresql/data
    networks:
      - bitsygrader-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOODLE_DB_USER:-moodle} -d ${MOODLE_DB_NAME:-moodle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bitsygrader-db:
    image: postgres:16-alpine
    container_name: bitsygrader-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BITSYGRADER_DB_USER:-bitsygrader}
      POSTGRES_PASSWORD: ${BITSYGRADER_DB_PASSWORD:-bitsygrader_password}
      POSTGRES_DB: ${BITSYGRADER_DB_NAME:-bitsygrader}
    volumes:
      - bitsygrader_db_data:/var/lib/postgresql/data
    networks:
      - bitsygrader-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BITSYGRADER_DB_USER:-bitsygrader} -d ${BITSYGRADER_DB_NAME:-bitsygrader}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  moodle:
    build:
      context: ./docker/moodle
      dockerfile: Dockerfile
      args:
        MOODLE_VERSION: ${MOODLE_VERSION:-MOODLE_405_STABLE}
    container_name: bitsygrader-moodle
    restart: unless-stopped
    depends_on:
      moodle-db:
        condition: service_healthy
    environment:
      # Database
      MOODLE_DB_TYPE: pgsql
      MOODLE_DB_HOST: moodle-db
      MOODLE_DB_PORT: 5432
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodle_password}
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      
      # Moodle
      MOODLE_WWW_HOST: ${MOODLE_HOST:-localhost}
      MOODLE_WWW_PORT: ${MOODLE_PORT:-8080}
      MOODLE_WWW_SCHEME: ${MOODLE_SCHEME:-http}
      
      # Admin
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-Admin123!}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-BitsyGrader LMS}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME:-bitsygrader}
      
      # Etc
      MOODLE_DEBUG: ${MOODLE_DEBUG:-false}
      MOODLE_SKIP_PASSWORD_POLICY: "true"
      
      TZ: ${TIMEZONE:-UTC}
    volumes:
      - moodle_data:/var/www/html
      - moodle_moodledata:/var/www/moodledata

      - ./docker/keys:/app/keys:ro
    ports:
      - "${MOODLE_PORT:-8080}:80"
    networks:
      - bitsygrader-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login/index.php"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  moodle-lti-init:
    image: postgres:16-alpine
    container_name: bitsygrader-moodle-lti-init
    depends_on:
      moodle:
        condition: service_healthy
    environment:
      PGHOST: moodle-db
      PGPORT: 5432
      PGUSER: ${MOODLE_DB_USER:-moodle}
      PGPASSWORD: ${MOODLE_DB_PASSWORD:-moodle_password}
      PGDATABASE: ${MOODLE_DB_NAME:-moodle}
      
      LTI_TOOL_NAME: ${LTI_TOOL_NAME:-BitsyGrader}
      LTI_TOOL_URL: ${LTI_TOOL_URL:-http://jupyterhub:8000}
      LTI_CLIENT_ID: ${LTI_CLIENT_ID:-bitsygrader-lti-client}
      LTI_PUBLIC_KEY_FILE: /app/keys/public.pem
      JUPYTERHUB_EXTERNAL_URL: ${JUPYTERHUB_EXTERNAL_URL:-http://localhost:8000}
    volumes:
      - ./docker/scripts/setup-lti.sh:/app/setup-lti.sh:ro
      - ./docker/keys:/app/keys:ro
      - lti_config:/app/lti-config
    entrypoint: ["/bin/sh", "/app/setup-lti.sh"]
    networks:
      - bitsygrader-network
    restart: "no"

  jupyterhub:
    build:
      context: ./docker/jupyterhub
      dockerfile: Dockerfile
    container_name: bitsygrader-jupyterhub
    restart: unless-stopped
    depends_on:
      bitsygrader-db:
        condition: service_healthy
    environment:
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY:-}
      CONFIGPROXY_AUTH_TOKEN: ${CONFIGPROXY_AUTH_TOKEN:-}
      
      DOCKER_NETWORK_NAME: bitsygrader-network
      DOCKER_NOTEBOOK_IMAGE: ${NOTEBOOK_IMAGE:-quay.io/jupyter/base-notebook:latest}
      
      BITSYGRADER_SERVICE_URL: http://bitsygrader:12345
      BITSYGRADER_SERVICE_TOKEN: ${BITSYGRADER_API_TOKEN:-bitsygrader-secret-token}
      
      JUPYTERHUB_DB_URL: postgresql://${BITSYGRADER_DB_USER:-bitsygrader}:${BITSYGRADER_DB_PASSWORD:-bitsygrader_password}@bitsygrader-db:5432/${BITSYGRADER_DB_NAME:-bitsygrader}
      
      LTI_CLIENT_ID: ${LTI_CLIENT_ID:-bitsygrader-lti-client}
      LTI_ISSUER: ${LTI_ISSUER:-http://moodle:8080}
      LTI_AUTHORIZE_URL: ${LTI_AUTHORIZE_URL:-http://moodle:8080/mod/lti/auth.php}
      LTI_TOKEN_URL: ${LTI_TOKEN_URL:-http://moodle:8080/mod/lti/token.php}
      LTI_JWKS_URL: ${LTI_JWKS_URL:-http://moodle:8080/mod/lti/certs.php}
    volumes:
      - jupyterhub_data:/srv/jupyterhub
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/jupyterhub/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
      - ./docker/keys:/srv/jupyterhub/keys:ro
      - lti_config:/srv/jupyterhub/lti-config:ro
    ports:
      - "${JUPYTERHUB_PORT:-8000}:8000"
    networks:
      - bitsygrader-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/hub/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  bitsygrader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bitsygrader-service
    restart: unless-stopped
    depends_on:
      bitsygrader-db:
        condition: service_healthy
      jupyterhub:
        condition: service_healthy
    environment:
      JUPYTERHUB_SERVICE_PREFIX: /services/bitsygrader/
      JUPYTERHUB_API_TOKEN: ${BITSYGRADER_API_TOKEN:-bitsygrader-secret-token}
      JUPYTERHUB_API_URL: http://jupyterhub:8000/hub/api
      JUPYTERHUB_SERVICE_URL: http://bitsygrader:12345
      
      BITSYGRADER_DB_URI: postgresql://${BITSYGRADER_DB_USER:-bitsygrader}:${BITSYGRADER_DB_PASSWORD:-bitsygrader_password}@bitsygrader-db:5432/${BITSYGRADER_DB_NAME:-bitsygrader}
      
      LTI_ENABLED: ${LTI_ENABLED:-true}
      LTI_CLIENT_ID: ${LTI_CLIENT_ID:-bitsygrader-lti-client}
      LTI_PLATFORM: ${LTI_PLATFORM:-moodle}
      LTI_LMS_URL: http://moodle:8080
      LTI_TOKEN_URL: http://moodle:8080/mod/lti/token.php
      LTI_NRPS_URL: http://moodle:8080/mod/lti/services.php
      LTI_KEY_PATH: /app/keys/private.pem
      
      AUTOGRADE_ENABLED: ${AUTOGRADE_ENABLED:-true}
      AUTOGRADE_WORKERS: ${AUTOGRADE_WORKERS:-4}
      AUTOGRADE_EXECUTOR: ${AUTOGRADE_EXECUTOR:-bitsygrader.autograde.executors.simple.SimpleExecutor}
    volumes:
      - bitsygrader_assets:/app/assets
      - ./docker/bitsygrader/bitsygrader_config.py:/app/config/bitsygrader_config.py:ro
      - ./docker/keys:/app/keys:ro
    networks:
      - bitsygrader-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12345/auth/whoami"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  bitsygrader-network:
    name: bitsygrader-network
    driver: bridge

volumes:
  moodle_db_data:
    name: bitsygrader-moodle-db-data
  moodle_data:
    name: bitsygrader-moodle-data
  moodle_moodledata:
    name: bitsygrader-moodle-moodledata
  bitsygrader_db_data:
    name: bitsygrader-db-data
  bitsygrader_assets:
    name: bitsygrader-assets
  jupyterhub_data:
    name: bitsygrader-jupyterhub-data
  lti_config:
    name: bitsygrader-lti-config
